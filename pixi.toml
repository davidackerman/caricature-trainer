[workspace]
name = "caricature-trainer"
version = "0.1.0"
description = "Timed random-face carousel for caricature drawing practice"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.9"
requests = "*"

[tasks]
download-faces = "python tools/download_pexels.py"
serve = "python -m http.server 8000"
